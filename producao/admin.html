<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Painel — Sailors Marketing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="config.js?v=20260801_sb"></script>
    <style>
        @font-face { font-family:'Awesome Serif'; src:local('Awesome Serif Regular'),local('AwesomeSerif-Regular'); font-weight:400; }
        @font-face { font-family:'Awesome Serif'; src:local('Awesome Serif Italic'),local('AwesomeSerif-Italic'); font-weight:400; font-style:italic; }
        @font-face { font-family:'Roobert'; src:local('Roobert Light'),local('Roobert-Light'); font-weight:300; }
        @font-face { font-family:'Roobert'; src:local('Roobert Regular'),local('Roobert-Regular'); font-weight:400; }
        @font-face { font-family:'Roobert'; src:local('Roobert Medium'),local('Roobert-Medium'); font-weight:500; }
        @font-face { font-family:'Roobert'; src:local('Roobert SemiBold'),local('Roobert-SemiBold'); font-weight:600; }
        @font-face { font-family:'Roobert'; src:local('Roobert Bold'),local('Roobert-Bold'); font-weight:700; }

        :root {
            --bg: #000000;
            --panel: rgba(20, 12, 6, 0.55);
            --panel-solid: rgba(30, 18, 8, 0.75);
            --line: rgba(255, 255, 255, 0.1);
            --fg: #ffffff;
            --muted: rgba(255,255,255,0.55);
            --muted2: rgba(255,255,255,0.35);
            --accent: #FF611A;
            --accent-soft: rgba(255, 97, 26, 0.18);
            --bege: #FFCFA9;
            --bege-soft: rgba(255,207,169,0.12);
            --good: #FF611A;
            --font-serif: 'Awesome Serif','Instrument Serif',serif;
            --font-sans: 'Roobert','Inter','Helvetica Neue',Arial,sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0 }
        html, body { margin: 0; padding: 0 }
        body {
            color: var(--fg);
            font-family: var(--font-sans);
            font-size: 15px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            background: var(--bg);
            min-height: 100vh;
        }
        a { color: var(--bege); text-decoration: none }
        a:hover { text-decoration: underline; color: var(--accent) }

        /* ── HEADER ── */
        header {
            display: flex; align-items: center; justify-content: space-between; gap: 16px;
            padding: 16px 26px;
            border-bottom: 1px solid var(--line);
            position: sticky; top: 0; z-index: 5;
            background: rgba(0,0,0,0.82);
            backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
        }
        header h1 {
            font-family: var(--font-sans);
            font-size: 15px; margin: 0; font-weight: 600;
            letter-spacing: 0.01em;
            display: flex; align-items: center; gap: 10px;
        }
        header h1 img { height: 20px; width: auto; filter: brightness(0) invert(1); }
        .hactions { display: flex; align-items: center; gap: 8px }

        #liveDot {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--good); display: inline-block;
            box-shadow: 0 0 0 0 rgba(255,97,26,0.5);
            animation: pulse 2.6s infinite;
        }
        #liveDot.off { background: var(--muted2); animation: none; box-shadow: none }
        @keyframes pulse {
            0%  { box-shadow: 0 0 0 0 rgba(255,97,26,0.45) }
            70% { box-shadow: 0 0 0 7px rgba(255,97,26,0) }
            100%{ box-shadow: 0 0 0 0 rgba(255,97,26,0) }
        }

        .wrap { max-width: 1280px; margin: 0 auto; padding: 24px 26px 60px }

        /* ── BUTTONS ── */
        button {
            font-family: inherit; font-size: 14px; cursor: pointer;
            border: 0; border-radius: 999px; padding: 10px 20px;
            background: var(--accent); color: #fff; font-weight: 600;
            transition: filter 0.15s, opacity 0.15s, background 0.15s;
        }
        button:hover { filter: brightness(1.1) }
        button.ghost {
            background: transparent; border: 1.5px solid var(--line);
            color: var(--fg); font-weight: 500;
        }
        button.ghost:hover { background: rgba(255,255,255,0.06); filter: none }
        button.sm { padding: 7px 14px; font-size: 13px }
        button:disabled { opacity: 0.45; cursor: default; filter: none }
        button.danger { background: transparent; border: 1.5px solid rgba(192,57,43,0.3); color: #e74c3c }
        button.danger:hover { background: rgba(192,57,43,0.08) }

        /* ── INPUT ── */
        input {
            font-family: inherit; font-size: 15px; height: 46px;
            padding: 0 16px; border-radius: 12px;
            border: 1.5px solid var(--line);
            background: var(--panel);
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
            color: var(--fg); width: 100%;
        }
        input::placeholder { color: var(--muted2) }
        input:focus { outline: none; border-color: rgba(255,97,26,0.5) }

        /* ── LOGIN ── */
        #login {
            display: none; max-width: 400px; margin: 16vh auto; padding: 36px 30px;
            border-radius: 22px;
            background: var(--panel); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--line);
            text-align: center;
        }
        #login img { height: 24px; margin-bottom: 20px; filter: brightness(0) invert(1) }
        #login h2 {
            font-family: var(--font-serif); font-style: italic;
            font-size: 1.8rem; font-weight: normal; margin: 0 0 6px;
        }
        #login h2 span { color: var(--accent) }
        #login p { margin: 0 0 18px; color: var(--muted); font-size: 13px }
        #login .row { display: flex; gap: 10px; margin-top: 14px }
        #loginErr { color: #ef5a6f; font-size: 13px; margin-top: 12px; min-height: 16px }

        /* ── TABS ── */
        .tabs {
            display: flex; gap: 4px;
            border-bottom: 1px solid var(--line);
            margin: 0 0 22px; overflow-x: auto; scrollbar-width: none;
        }
        .tabs::-webkit-scrollbar { display: none }
        .tab {
            background: none; border: 0; border-bottom: 2px solid transparent;
            border-radius: 0; padding: 12px 16px;
            color: var(--muted); font-weight: 600; font-size: 14px;
            white-space: nowrap; transition: color 0.15s, border-color 0.15s;
        }
        .tab:hover { color: var(--fg); filter: none; background: none }
        .tab.on { color: var(--accent); border-bottom-color: var(--accent) }
        .tab .cnt {
            display: inline-block; margin-left: 6px; padding: 1px 7px;
            border-radius: 999px; font-size: 11px;
            background: rgba(255,255,255,0.1); color: var(--muted); font-weight: 600;
        }
        .tab.on .cnt { background: var(--accent-soft); color: var(--accent) }
        .pane { display: none }
        .pane.on { display: block }

        /* ── CARDS ── */
        .cards {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 14px; margin-bottom: 26px;
        }
        .card {
            background: var(--panel); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--line); border-radius: 18px; padding: 20px 22px;
        }
        .card .k {
            color: var(--muted); font-size: 10px; text-transform: uppercase;
            letter-spacing: 0.14em; font-weight: 600;
        }
        .card .v {
            font-size: 30px; font-weight: 700; margin-top: 8px; letter-spacing: -0.01em;
            font-family: var(--font-serif);
        }
        .card .sub { color: var(--muted2); font-size: 12px; margin-top: 3px }
        .card.highlight { border-color: var(--accent); background: var(--accent-soft) }
        .card.highlight .k { color: var(--bege) }
        .card.highlight .v { color: var(--accent) }

        section { margin-bottom: 34px }
        section > h3 {
            font-size: 11px; text-transform: uppercase; letter-spacing: 0.16em;
            color: var(--muted); margin: 0 0 14px; font-weight: 600;
        }

        /* ── FILTER BAR ── */
        .bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px }
        .bar input.search { height: 42px; flex: 1; min-width: 200px; max-width: 340px; font-size: 14px }
        .seg {
            display: inline-flex; border: 1.5px solid var(--line);
            border-radius: 999px; overflow: hidden;
        }
        .seg button {
            border-radius: 0; background: transparent; color: var(--muted);
            font-size: 13px; padding: 8px 14px; font-weight: 500;
        }
        .seg button:hover { background: rgba(255,255,255,0.06); filter: none; color: var(--fg) }
        .seg button.on { background: var(--accent); color: #fff; font-weight: 600 }
        .barnote { color: var(--muted2); font-size: 12.5px; margin-left: auto }

        /* ── TABLE ── */
        .tblwrap {
            overflow-x: auto; border-radius: 18px;
            border: 1px solid var(--line); background: var(--panel);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        }
        .tbl { width: 100%; border-collapse: collapse }
        .tbl th, .tbl td {
            text-align: left; padding: 13px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            white-space: nowrap; font-size: 14px;
        }
        .tbl th {
            color: var(--bege); font-weight: 600; font-size: 10px;
            text-transform: uppercase; letter-spacing: 0.12em;
            background: rgba(0,0,0,0.3); position: sticky; top: 0;
        }
        .tbl tr:last-child td { border-bottom: 0 }
        .tbl tbody tr:hover td { background: rgba(255,97,26,0.03) }
        .tbl td.dim { color: var(--muted) }
        .pill {
            display: inline-block; padding: 3px 11px; border-radius: 999px;
            font-size: 11px; font-weight: 600; letter-spacing: 0.02em;
        }
        .pill.lead { background: var(--accent-soft); color: var(--accent) }
        .muted { color: var(--muted) }
        .empty { color: var(--muted); padding: 28px 16px; font-size: 14px; text-align: center }
        .empty b { color: var(--fg); font-weight: 600 }
        .right { text-align: right }
        .nowrap { white-space: nowrap }

        /* ── TOAST ── */
        .toast {
            position: fixed; bottom: -80px; right: 24px;
            background: var(--panel-solid); backdrop-filter: blur(10px);
            border: 1px solid var(--line); border-radius: 12px;
            color: var(--fg); padding: 14px 24px;
            z-index: 100; transition: bottom 0.4s cubic-bezier(0.16,1,0.3,1);
            font-weight: 500; font-size: 13px;
        }
        .toast.show { bottom: 24px }

        /* ── RESPONSIVE ── */
        @media (max-width: 560px) {
            .wrap { padding: 16px 14px 48px }
            header { padding: 14px 16px }
            .bar input.search { max-width: none }
            .cards { grid-template-columns: 1fr 1fr }
        }
    </style>
</head>
<body>

<!-- Login -->
<div id="login">
    <img src="logo-sailors.png" alt="Sailors">
    <h2>Painel de <span>Controle</span></h2>
    <p>Acesso restrito à equipe Sailors</p>
    <input id="adminPwd" type="password" placeholder="Senha de acesso" autocomplete="off">
    <div class="row">
        <button id="btnLogin" style="flex:1">Entrar</button>
    </div>
    <div id="loginErr"></div>
</div>

<!-- App -->
<div id="app" style="display:none">
    <header>
        <h1>
            <img src="logo-sailors.png" alt="Sailors">
            <span style="color:var(--muted2)">·</span> Painel
        </h1>
        <div class="hactions">
            <span id="liveDot" title="Atualização automática"></span>
            <span id="liveTxt" class="muted" style="font-size:12px"></span>
            <button class="ghost sm" id="btnRefresh">Atualizar</button>
            <a href="index.html" class="ghost sm" style="display:inline-flex;align-items:center;padding:7px 14px;font-size:13px;border:1.5px solid rgba(255,255,255,0.1);border-radius:999px;color:#fff;text-decoration:none;font-weight:500">← LP</a>
            <button class="ghost sm" id="btnLogout">Sair</button>
        </div>
    </header>

    <div class="wrap">
        <!-- Tabs -->
        <div class="tabs" id="tabs">
            <button class="tab on" data-tab="geral">Visão geral</button>
            <button class="tab" data-tab="leads">Leads <span class="cnt" id="cntLeads">0</span></button>
        </div>

        <!-- Visão Geral -->
        <div class="pane on" data-pane="geral">
            <div class="cards" id="cards"></div>
            <section>
                <h3>Últimos leads</h3>
                <div class="tblwrap"><table class="tbl" id="tblRecent"></table></div>
            </section>
            <section>
                <h3>Distribuição por Cargo</h3>
                <div class="tblwrap"><table class="tbl" id="tblCargo"></table></div>
            </section>
            <section>
                <h3>Distribuição por Faturamento</h3>
                <div class="tblwrap"><table class="tbl" id="tblFat"></table></div>
            </section>
        </div>

        <!-- Leads -->
        <div class="pane" data-pane="leads">
            <div class="bar">
                <input class="search" id="qLeads" placeholder="Buscar nome, empresa, cargo, faturamento…" autocomplete="off">
                <div class="seg" id="perLeads">
                    <button data-per="1">Hoje</button>
                    <button data-per="7">7 dias</button>
                    <button data-per="30">30 dias</button>
                    <button data-per="0" class="on">Tudo</button>
                </div>
                <button class="ghost sm" id="btnCsv">⬇ CSV</button>
                <button class="danger sm" id="btnClear">Limpar</button>
                <span class="barnote" id="noteLeads"></span>
            </div>
            <div class="tblwrap"><table class="tbl" id="tblLeads"></table></div>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   SAILORS MARKETING — ADMIN PANEL (Supabase-powered)
   ═══════════════════════════════════════════════════════════════════ */

const SB_URL = (typeof SAILORS_CONFIG !== 'undefined' && SAILORS_CONFIG.supabaseUrl) || '';
const SB_KEY = (typeof SAILORS_CONFIG !== 'undefined' && SAILORS_CONFIG.supabaseAnonKey) || '';
const ADMIN_PWD = (typeof SAILORS_CONFIG !== 'undefined' && SAILORS_CONFIG.adminPassword) || 'sailors2026';

let cachedLeads = [];
let cachedVisits = [];
let HOJE = new Date().toISOString().slice(0, 10);

/* ── helpers ── */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => (s == null ? '' : String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function haQuanto(dateStr) {
    if (!dateStr) return '—';
    // Try parsing various formats
    let d;
    if (dateStr.includes('T') || dateStr.includes('-')) {
        d = new Date(dateStr);
    } else {
        // pt-BR format: DD/MM/YYYY HH:MM:SS
        const parts = dateStr.match(/(\d{2})\/(\d{2})\/(\d{4}),?\s*(\d{2}):(\d{2})/);
        if (parts) d = new Date(parts[3], parts[2]-1, parts[1], parts[4], parts[5]);
        else d = new Date(dateStr);
    }
    if (isNaN(d)) return dateStr;
    const s = (Date.now() - d.getTime()) / 1000;
    if (s < 60) return 'agora';
    if (s < 3600) return 'há ' + Math.floor(s/60) + ' min';
    if (s < 86400) return 'há ' + Math.floor(s/3600) + 'h';
    if (s < 172800) return 'ontem';
    if (s < 604800) return 'há ' + Math.floor(s/86400) + ' dias';
    return d.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit', year:'2-digit'});
}

function fmtDate(dateStr) {
    if (!dateStr) return '—';
    let d;
    if (dateStr.includes('T') || dateStr.includes('-')) {
        d = new Date(dateStr);
    } else {
        const parts = dateStr.match(/(\d{2})\/(\d{2})\/(\d{4}),?\s*(\d{2}):(\d{2})/);
        if (parts) d = new Date(parts[3], parts[2]-1, parts[1], parts[4], parts[5]);
        else d = new Date(dateStr);
    }
    if (isNaN(d)) return dateStr;
    return d.toLocaleString('pt-BR', {day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit'});
}

function parseDate(dateStr) {
    if (!dateStr) return null;
    let d;
    if (dateStr.includes('T') || dateStr.includes('-')) {
        d = new Date(dateStr);
    } else {
        const parts = dateStr.match(/(\d{2})\/(\d{2})\/(\d{4}),?\s*(\d{2}):(\d{2})/);
        if (parts) d = new Date(parts[3], parts[2]-1, parts[1], parts[4], parts[5]);
        else d = new Date(dateStr);
    }
    return isNaN(d) ? null : d;
}

function idadeDias(dateStr) {
    const d = parseDate(dateStr);
    if (!d) return 1e9;
    return Math.round((Date.now() - d.getTime()) / 86400000);
}

const noPeriodo = (dateStr, per) => per === 0 ? true : idadeDias(dateStr) < per;

function casaBusca(obj, q) {
    const t = (q || '').trim().toLowerCase();
    if (!t) return true;
    const hay = Object.values(obj).map(v => String(v == null ? '' : v)).join(' ').toLowerCase();
    return t.split(/\s+/).every(w => hay.includes(w));
}

function waLink(tel) {
    const d = (tel || '').toString().replace(/\D/g, '');
    if (d.length < 10) return '';
    return 'https://wa.me/' + (d.length <= 11 ? '55' + d : d);
}

/* ── toast ── */
let toastTimeout = null;
function showToast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    if (toastTimeout) clearTimeout(toastTimeout);
    t.classList.add('show');
    toastTimeout = setTimeout(() => t.classList.remove('show'), 3000);
}

/* ── auth ── */
function showLogin(msg) {
    $('#app').style.display = 'none';
    $('#login').style.display = 'block';
    $('#loginErr').textContent = msg || '';
    $('#adminPwd').focus();
}
function showApp() {
    $('#login').style.display = 'none';
    $('#app').style.display = 'block';
}

/* ── state ── */
const UI = {
    tab: 'geral',
    leads: { q: '', per: 0 }
};

function setTab(t) {
    UI.tab = t;
    $$('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
    $$('.pane').forEach(p => p.classList.toggle('on', p.dataset.pane === t));
}

/* ── data loading ── */
async function loadLeads(silent) {
    if (!SB_URL || !SB_KEY) {
        showToast('Supabase não configurado.');
        return;
    }
    if (!silent) $('#btnRefresh').disabled = true;

    try {
        const [rLeads, rVisits] = await Promise.all([
            fetch(SB_URL + '/rest/v1/leads?select=*&order=created_at.desc', {
                headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY }
            }),
            fetch(SB_URL + '/rest/v1/visits?select=*&order=created_at.desc', {
                headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY }
            })
        ]);
        if (!rLeads.ok) throw new Error('HTTP ' + rLeads.status);
        cachedLeads = await rLeads.json();
        cachedVisits = rVisits.ok ? await rVisits.json() : [];
        render();
        marcarVivo(true);
        startAuto();
    } catch (err) {
        console.error('Erro ao carregar leads:', err);
        if (silent) marcarVivo(false);
        else showToast('Erro ao carregar. Verifique a conexão.');
    } finally {
        if (!silent) $('#btnRefresh').disabled = false;
    }
}

/* ── render ── */
function render() {
    const leads = cachedLeads;
    $('#cntLeads').textContent = leads.length;

    renderCards(leads);
    renderRecent(leads);
    renderCargo(leads);
    renderFat(leads);
    renderLeadsTable();
}

function renderCards(leads) {
    const now = new Date();
    const todayStr = now.toISOString().slice(0, 10);
    const weekAgo = new Date(now.getTime() - 7 * 86400000);

    let leadsHoje = 0, leadsSemana = 0;
    let lastDate = '—';

    leads.forEach(l => {
        const d = parseDate(l.created_at || l.data);
        if (d) {
            if (d.toISOString().slice(0,10) === todayStr) leadsHoje++;
            if (d >= weekAgo) leadsSemana++;
        }
    });

    if (leads.length > 0) {
        const first = leads[0]; // already sorted desc
        lastDate = haQuanto(first.created_at || first.data);
    }

    // Visit stats
    let visitasHoje = 0, visitasSemana = 0;
    cachedVisits.forEach(v => {
        const d = parseDate(v.created_at);
        if (d) {
            if (d.toISOString().slice(0,10) === todayStr) visitasHoje++;
            if (d >= weekAgo) visitasSemana++;
        }
    });

    const conversao = cachedVisits.length > 0
        ? Math.round((leads.length / cachedVisits.length) * 100) + '%'
        : '—';

    $('#cards').innerHTML = [
        ['Visitas hoje', visitasHoje, 'sessões únicas hoje', false],
        ['Visitas semana', visitasSemana, 'últimos 7 dias', false],
        ['Total de Visitas', cachedVisits.length, 'desde o início do rastreio', false],
        ['Leads hoje', leadsHoje, 'novos leads hoje', false],
        ['Esta semana', leadsSemana, 'últimos 7 dias', false],
        ['Total de Leads', leads.length, 'formulários preenchidos', true],
        ['Conversão', conversao, 'visitante → lead', false],
        ['Último lead', lastDate, 'lead mais recente', false],
    ].map(([k, v, sub, hl]) =>
        `<div class="card${hl ? ' highlight' : ''}">
            <div class="k">${esc(k)}</div>
            <div class="v">${esc(String(v))}</div>
            <div class="sub">${esc(sub)}</div>
        </div>`
    ).join('');
}

function renderRecent(leads) {
    const top = leads.slice(0, 6);
    $('#tblRecent').innerHTML = top.length ? (
        '<tr><th>Quando</th><th>Nome</th><th>Contato</th><th>Cargo</th><th>Empresa</th></tr>' +
        top.map(l => {
            const wa = waLink(l.whatsapp);
            const waStr = (l.whatsapp || '').toString();
            return `<tr>
                <td class="nowrap">${esc(haQuanto(l.created_at || l.data))}</td>
                <td><strong>${esc(l.nome) || '<span class="muted">—</span>'}</strong></td>
                <td>${wa ? `<a href="${esc(wa)}" target="_blank">🟢 ${esc(waStr)}</a>` : (l.email ? `<a href="mailto:${esc(l.email)}">${esc(l.email)}</a>` : '<span class="muted">—</span>')}</td>
                <td><span class="pill lead">${esc(l.cargo) || '—'}</span></td>
                <td class="dim">${esc(l.empresa) || '—'}</td>
            </tr>`;
        }).join('')
    ) : '<tr><td class="empty" colspan="5">Nenhum lead captado ainda.<br><span class="muted">Faça um teste preenchendo o formulário de contato!</span></td></tr>';
}

function renderCargo(leads) {
    const counts = {};
    leads.forEach(l => { if (l.cargo) counts[l.cargo] = (counts[l.cargo] || 0) + 1; });
    const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);

    $('#tblCargo').innerHTML = sorted.length ? (
        '<tr><th>Cargo</th><th class="right">Leads</th><th class="right">%</th></tr>' +
        sorted.map(([cargo, count]) => {
            const pct = leads.length > 0 ? Math.round((count / leads.length) * 100) : 0;
            return `<tr><td>${esc(cargo)}</td><td class="right">${count}</td><td class="right">${pct}%</td></tr>`;
        }).join('')
    ) : '<tr><td class="empty">Sem dados</td></tr>';
}

function renderFat(leads) {
    const counts = {};
    leads.forEach(l => { if (l.faturamento) counts[l.faturamento] = (counts[l.faturamento] || 0) + 1; });
    const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);

    $('#tblFat').innerHTML = sorted.length ? (
        '<tr><th>Faturamento</th><th class="right">Leads</th><th class="right">%</th></tr>' +
        sorted.map(([fat, count]) => {
            const pct = leads.length > 0 ? Math.round((count / leads.length) * 100) : 0;
            return `<tr><td>${esc(fat)}</td><td class="right">${count}</td><td class="right">${pct}%</td></tr>`;
        }).join('')
    ) : '<tr><td class="empty">Sem dados</td></tr>';
}

function renderLeadsTable() {
    const all = cachedLeads;
    const dateField = l => l.created_at || l.data;
    const f = all.filter(l => noPeriodo(dateField(l), UI.leads.per) && casaBusca(l, UI.leads.q));

    $('#noteLeads').textContent = f.length + ' de ' + all.length;

    $('#tblLeads').innerHTML = f.length ? (
        '<tr><th>Quando</th><th>Nome</th><th>WhatsApp</th><th>E-mail</th><th>Empresa</th><th>Instagram</th><th>Cargo</th><th>Faturamento</th></tr>' +
        f.map(l => {
            const wa = waLink(l.whatsapp);
            const waStr = (l.whatsapp || '').toString();
            const insta = (l.instagram || '').toString();
            const cleanInsta = insta.startsWith('@') ? insta.substring(1) : insta;
            return `<tr>
                <td class="nowrap" title="${esc(fmtDate(dateField(l)))}">${esc(haQuanto(dateField(l)))}</td>
                <td><strong>${esc(l.nome) || '—'}</strong></td>
                <td>${wa ? `<a href="${esc(wa)}" target="_blank">🟢 ${esc(waStr)}</a>` : (waStr || '<span class="muted">—</span>')}</td>
                <td>${l.email ? `<a href="mailto:${esc(l.email)}">${esc(l.email)}</a>` : '<span class="muted">—</span>'}</td>
                <td class="dim">${esc(l.empresa) || '—'}</td>
                <td>${insta ? `<a href="https://instagram.com/${esc(cleanInsta)}" target="_blank">@${esc(cleanInsta)}</a>` : '<span class="muted">—</span>'}</td>
                <td><span class="pill lead">${esc(l.cargo) || '—'}</span></td>
                <td class="dim">${esc(l.faturamento) || '—'}</td>
            </tr>`;
        }).join('')
    ) : '<tr><td class="empty" colspan="8">' +
        (all.length ? 'Nenhum lead neste período ou busca.' : 'Nenhum lead captado ainda.') +
        '</td></tr>';
}

/* ── auto refresh ── */
const AUTO_MS = 20000;
let _autoTimer = null;

function startAuto() {
    if (_autoTimer) return;
    _autoTimer = setInterval(() => {
        if (sessionStorage.getItem('sailors_admin_auth') === 'true' && !document.hidden) loadLeads(true);
    }, AUTO_MS);
}
function stopAuto() {
    if (_autoTimer) { clearInterval(_autoTimer); _autoTimer = null; }
}

function marcarVivo(ok) {
    $('#liveDot').classList.toggle('off', !ok);
    $('#liveTxt').textContent = ok
        ? new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'})
        : 'sem conexão';
}

document.addEventListener('visibilitychange', () => {
    if (!document.hidden && sessionStorage.getItem('sailors_admin_auth') === 'true') loadLeads(true);
});

/* ── CSV export ── */
function exportCSV() {
    const leads = cachedLeads;
    if (leads.length === 0) { showToast('Nenhum lead para exportar!'); return; }

    let csv = "\uFEFFData;Nome;WhatsApp;Email;Empresa;Instagram;Cargo;Faturamento\n";
    leads.forEach(l => {
        const row = [
            fmtDate(l.created_at || l.data), l.nome, l.whatsapp, l.email,
            l.empresa, l.instagram, l.cargo, l.faturamento
        ].map(v => `"${(v||'').toString().replace(/"/g, '""')}"`).join(';');
        csv += row + "\n";
    });

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `leads_sailors_${Date.now()}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    showToast('CSV exportado!');
}

/* ── clear leads ── */
function clearLeads() {
    if (!confirm('Deseja realmente apagar TODOS os leads? Esta ação não pode ser desfeita.')) return;
    fetch(SB_URL + '/rest/v1/leads?id=gt.0', {
        method: 'DELETE',
        headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY }
    })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); loadLeads(); showToast('Histórico limpo!'); })
    .catch(err => { console.error(err); showToast('Erro ao limpar. Verifique permissões.'); });
}

/* ── events ── */
$('#tabs').addEventListener('click', e => {
    const b = e.target.closest('.tab');
    if (b) setTab(b.dataset.tab);
});

// Search with debounce
let searchTimeout;
$('#qLeads').addEventListener('input', e => {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => { UI.leads.q = e.target.value; renderLeadsTable(); }, 120);
});

// Period filter
$('#perLeads').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    $('#perLeads').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    UI.leads.per = +b.dataset.per;
    renderLeadsTable();
});

// Login
$('#btnLogin').onclick = () => {
    const pwd = $('#adminPwd').value.trim();
    if (!pwd) { $('#loginErr').textContent = 'Digite a senha.'; return; }
    if (pwd === ADMIN_PWD) {
        sessionStorage.setItem('sailors_admin_auth', 'true');
        showApp();
        loadLeads();
    } else {
        $('#loginErr').textContent = 'Senha incorreta. Tente novamente.';
        $('#adminPwd').value = '';
    }
};
$('#adminPwd').addEventListener('keydown', e => { if (e.key === 'Enter') $('#btnLogin').click(); });

$('#btnRefresh').onclick = () => loadLeads();
$('#btnCsv').onclick = exportCSV;
$('#btnClear').onclick = clearLeads;
$('#btnLogout').onclick = () => { stopAuto(); sessionStorage.removeItem('sailors_admin_auth'); showLogin(''); };

// Init
if (sessionStorage.getItem('sailors_admin_auth') === 'true') {
    showApp();
    loadLeads();
} else {
    showLogin('');
}
</script>
</body>
</html>
